## This code will call the extractor process.

- name: "Run database extractor"
  shell: |
    set -eo pipefail
    export ORACLE_HOME
    export ORACLE_SID
    export DB_EXP_USER="{{ dump_user_int }}"
    export DB_EXP_DIRECTORY="{{ dump_dir_name }}"
    export DB_EXP_GEN_DUMP=false
    export DB_EXP_IGNORE_ERROR=false
    export DB_EXP_INTERNAL_ONLY=false
    export DB_EXP_USER_PASS="{{ dump_pass }}"
    [ ! -d ~/exporter_logs ] && mkdir ~/exporter_logs
    [ -d ~/oradiff_exporter ] && rm -rf ~/oradiff_exporter && mkdir ~/oradiff_exporter
    unzip -q "{{ VM_folder }}/user_scripts/odbfcl/oradiff_exporter.zip" -d ~/
    sh ~/oradiff_exporter/exporter.sh db 2>&1 | tee ~/exporter_logs/{{ file_suffix }}.log
  environment:
    ORACLE_HOME: "{{ dbhome_locl }}"
    ORACLE_SID: "{{ mysid }}"
  become: true
  become_user: oracle
  delegate_to: "{{ vm_ip_address }}"
