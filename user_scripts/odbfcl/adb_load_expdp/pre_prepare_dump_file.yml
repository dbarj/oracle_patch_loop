- name : Define expdp filename
  set_fact:
    file_suffix: "{{ db_version }}_{{ patch.base_ru | default('') }}{{ patch.type }}_{{ patch.id }}"
    dump_file_prefix: "tables_{{ db_version }}_{{ patch.base_ru | default('') }}{{ patch.type }}_{{ patch.id }}"

- name: Set DMP load file name
  set_fact:
    load_file_name: "{{ dump_file_prefix }}.dmp"
  when: not (patch.upload_only | default(false))

- name: Set ZIP load file name
  set_fact:
    load_file_name: "{{ dump_file_prefix }}.zip"
  when: (patch.upload_only | default(false))

- name: "Check if {{ output_folder }}/expdp/{{ load_file_name }} exists"
  stat:
    path: "{{ output_folder }}/expdp/{{ load_file_name }}"
  register: load_file_stat_result

- name: "Copy {{ load_file_name }} to shared_folder"
  copy:
    src: "{{ output_folder }}/expdp/{{ load_file_name }}"
    dest: "{{ shared_folder }}"
  when: load_file_stat_result.stat.exists